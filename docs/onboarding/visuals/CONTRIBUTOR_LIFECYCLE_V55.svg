<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Contributor workflow status is separate from evidence status</title>
  <desc id="desc">An upper workflow rail follows an idea from received through hard gates, a test card, and an action class. Repair, data request, park, duplicate or closed, and unsafe stop do not create evidence. Only a valid frozen completed test reaches a lower evidence rail with supported but bounded, attenuated, null, or inconclusive outcomes. Invalid and data-blocked inputs permit no biological interpretation.</desc>
  <style>
    .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .section { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .head { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .body { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .compact { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .ink { fill: #172033; }
    .muted { fill: #52606d; }
    .workflow { fill: #f0ecf8; stroke: #5b4b8a; stroke-width: 2; }
    .gate { fill: #e8f2fa; stroke: #005a9c; stroke-width: 2.5; }
    .supported { fill: #e9f5ef; stroke: #1b6b4b; stroke-width: 2.5; }
    .bounded { fill: #fff4d6; stroke: #8a5a00; stroke-width: 2.5; }
    .negative { fill: #f8ecea; stroke: #8b2e2e; stroke-width: 2.5; }
    .neutral { fill: #ffffff; stroke: #52606d; stroke-width: 2; stroke-dasharray: 7 5; }
    .arrow { stroke: #52606d; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .barrier { stroke: #172033; stroke-width: 3; stroke-dasharray: 10 6; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#f7f9fc"/>
  <text class="title ink" x="55" y="48">What happens to an idea: workflow status is not evidence status</text>
  <text class="subtitle muted" x="55" y="76">A proposal can move operationally without becoming more likely, supported, or clinically usable.</text>

  <text class="section ink" x="55" y="116">WORKFLOW RAIL · where the proposal goes</text>

  <g transform="translate(55 137)">
    <rect class="workflow" width="170" height="92" rx="13"/>
    <text class="head ink" x="17" y="29">1  RECEIVED</text>
    <text class="body ink" x="17" y="54">Record exact idea, source,</text>
    <text class="body ink" x="17" y="73">boundary, safety, and access.</text>
  </g>
  <path class="arrow" d="M 225 183 H 254"/>

  <g transform="translate(255 137)">
    <rect class="workflow" width="170" height="92" rx="13"/>
    <text class="head ink" x="17" y="25">2  HARD GATES</text>
    <text class="compact ink" x="17" y="47">Pass, repair, or stop</text>
    <text class="compact ink" x="17" y="65">Scope · permission</text>
    <text class="compact ink" x="17" y="83">Testability</text>
  </g>
  <path class="arrow" d="M 425 183 H 454"/>

  <g transform="translate(455 137)">
    <rect class="workflow" width="170" height="92" rx="13"/>
    <text class="head ink" x="17" y="25">3  TEST CARD</text>
    <text class="compact ink" x="17" y="47">Claim · prediction</text>
    <text class="compact ink" x="17" y="65">Data · null · holdout</text>
    <text class="compact ink" x="17" y="83">Drop rule · decision</text>
  </g>
  <path class="arrow" d="M 625 183 H 654"/>

  <g transform="translate(655 137)">
    <rect class="workflow" width="190" height="92" rx="13"/>
    <text class="head ink" x="17" y="25">4  ACTION CLASS</text>
    <text class="compact ink" x="17" y="47">Repair · request data</text>
    <text class="compact ink" x="17" y="65">Park · close · external test</text>
    <text class="compact ink" x="17" y="83">Run now</text>
  </g>
  <path class="arrow" d="M 845 183 H 874"/>

  <g transform="translate(875 137)">
    <rect class="gate" width="270" height="92" rx="13"/>
    <text class="head ink" x="17" y="29">5  FREEZE, THEN RUN</text>
    <text class="body ink" x="17" y="54">Only eligible inputs + fixed test</text>
    <text class="body ink" x="17" y="73">+ valid execution reach evidence.</text>
  </g>

  <g transform="translate(255 254)">
    <rect class="neutral" width="590" height="72" rx="12"/>
    <text class="head ink" x="18" y="27">NO EVIDENCE GRADE YET</text>
    <text class="body ink" x="18" y="50">Received · needs repair · data request · parked · duplicate/closed · unsafe stop</text>
  </g>
  <path class="arrow" d="M 742 229 V 253"/>

  <line class="barrier" x1="55" y1="360" x2="1145" y2="360"/>
  <rect x="363" y="344" width="474" height="32" rx="16" fill="#172033"/>
  <text class="small" x="389" y="365" fill="#ffffff">ONLY A VALID, FROZEN, COMPLETED TEST CROSSES THIS LINE</text>

  <text class="section ink" x="55" y="414">EVIDENCE-OUTCOME RAIL · what a valid test permits us to say</text>

  <g transform="translate(55 438)">
    <rect class="supported" width="245" height="112" rx="13"/>
    <text class="head ink" x="17" y="28">SUPPORTED, BOUNDED</text>
    <text class="body ink" x="17" y="54">The fixed result held in scope.</text>
    <text class="body ink" x="17" y="74">Keep uncertainty and any</text>
    <text class="body ink" x="17" y="94">provisional validation need.</text>
  </g>

  <g transform="translate(325 438)">
    <rect class="bounded" width="245" height="112" rx="13"/>
    <text class="head ink" x="17" y="28">ATTENUATED / NARROWED</text>
    <text class="body ink" x="17" y="54">A smaller interpretation survives.</text>
    <text class="body ink" x="17" y="74">Rewrite the claim; do not select</text>
    <text class="body ink" x="17" y="94">the most favorable sensitivity.</text>
  </g>

  <g transform="translate(595 438)">
    <rect class="negative" width="245" height="112" rx="13"/>
    <text class="head ink" x="17" y="28">NULL / NOT SUPPORTED</text>
    <text class="body ink" x="17" y="54">The fair scoped test did not hold.</text>
    <text class="body ink" x="17" y="74">Stop or narrow this route; do not</text>
    <text class="body ink" x="17" y="94">generalize beyond detectable scope.</text>
  </g>

  <g transform="translate(865 438)">
    <rect class="bounded" width="280" height="112" rx="13"/>
    <text class="head ink" x="17" y="28">INCONCLUSIVE</text>
    <text class="body ink" x="17" y="54">Uncertainty spans decisions that</text>
    <text class="body ink" x="17" y="74">matter. Use it to specify the next</text>
    <text class="body ink" x="17" y="94">sample or data-quality requirement.</text>
  </g>

  <g transform="translate(55 578)">
    <rect class="neutral" width="1090" height="68" rx="12"/>
    <text class="head ink" x="18" y="27">INVALID OR DATA BLOCKED · NO BIOLOGICAL INTERPRETATION</text>
    <text class="body ink" x="18" y="50">Repair the input or acquire the missing design. “Cannot test here” does not mean “biology absent.”  [P01]</text>
  </g>

  <g transform="translate(55 677)">
    <text class="small ink" x="0" y="0">RECEIVED ≠ SUPPORTED</text>
    <text class="small ink" x="220" y="0">RUNNABLE ≠ LIKELY TRUE</text>
    <text class="small ink" x="467" y="0">PARKED ≠ NEGATIVE</text>
    <text class="small ink" x="665" y="0">SUPPORTED ≠ CLINICAL</text>
    <text class="small ink" x="904" y="0">DATA BLOCKED ≠ ABSENT</text>
  </g>
  <text class="body muted" x="55" y="726">Every public response records scope, uncertainty, provenance, decision, and what evidence could change it.  [E01, A01, M05]</text>
  <text class="body muted" x="55" y="752">This is a workflow diagram, not a scientific result and not a promise that every submitted idea will be run.</text>
</svg>
