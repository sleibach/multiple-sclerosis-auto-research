<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">How the provisional APC HLA-II treatment-monitoring score works and what it cannot claim</title>
  <desc id="desc">A paired baseline and early-treatment measurement feeds a fixed gene-module change score and a preregistered external test. The signal may monitor early immune remodeling but does not identify a drug target, choose a treatment, prove clinical benefit, or establish an effect on progression. Pass, fail, and inconclusive external outcomes are all shown.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .ink { fill: #172033; }
      .muted { fill: #52606d; }
      .title { font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .head { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .4px; }
      .tiny { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .step { fill: #ffffff; stroke: #52606d; stroke-width: 1.7; }
      .score { fill: #e8f2fa; stroke: #005a9c; stroke-width: 3; }
      .support { fill: #e9f5ef; stroke: #1b6b4b; stroke-width: 2; }
      .bound { fill: #fff4d6; stroke: #8a5a00; stroke-width: 2; }
      .stop { fill: #f8ecea; stroke: #8b2e2e; stroke-width: 2.5; }
      .outcome { fill: #ffffff; stroke: #7b8794; stroke-width: 1.7; }
      .arrow { stroke: #7b8794; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .blocked { stroke: #8b2e2e; stroke-width: 3; fill: none; stroke-dasharray: 7 5; marker-end: url(#redhead); }
      .divider { stroke: #d5dce5; stroke-width: 1.2; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7b8794"/>
    </marker>
    <marker id="redhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b2e2e"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="780"/>
  <text class="title ink" x="55" y="51">The one live lead: a monitor, not a target</text>
  <text class="subtitle muted" x="55" y="79">A fixed early-change score with bounded internal evidence and a frozen outside-validation test. [M01-M05, A01]</text>

  <text class="section ink" x="55" y="117">What the locked analysis does</text>

  <!-- Fixed analysis path -->
  <g transform="translate(55,136)">
    <rect class="step" x="0" y="0" width="175" height="92" rx="12"/>
    <text class="small muted" x="16" y="22">1  SAME PERSON</text>
    <text class="head ink" x="16" y="48">Baseline sample</text>
    <text class="body ink" x="16" y="69">Before treatment change</text>

    <path class="arrow" d="M181 46 L221 46"/>

    <rect class="step" x="227" y="0" width="175" height="92" rx="12"/>
    <text class="small muted" x="243" y="22">2  SAME PERSON</text>
    <text class="head ink" x="243" y="48">Early sample</text>
    <text class="body ink" x="243" y="69">After treatment begins</text>

    <path class="arrow" d="M408 46 L448 46"/>

    <rect class="step" x="454" y="0" width="190" height="92" rx="12"/>
    <text class="small muted" x="470" y="22">3  FIXED FEATURE</text>
    <text class="head ink" x="470" y="48">Early-change delta</text>
    <text class="body ink" x="470" y="69">Locked APC/HLA-II genes</text>

    <path class="arrow" d="M650 46 L690 46"/>

    <rect class="score" x="696" y="0" width="190" height="92" rx="12"/>
    <text class="small ink" x="712" y="22">4  NO REFITTING</text>
    <text class="head ink" x="712" y="48">Bounded score</text>
    <text class="body ink" x="712" y="69">One scalar, fixed in V22</text>

    <path class="arrow" d="M892 46 L932 46"/>

    <rect class="step" x="938" y="0" width="152" height="92" rx="12"/>
    <text class="small muted" x="954" y="22">5  BLIND TEST</text>
    <text class="head ink" x="954" y="48">Compare with</text>
    <text class="body ink" x="954" y="69">fixed response label</text>
  </g>

  <line class="divider" x1="55" y1="250" x2="1145" y2="250"/>

  <!-- Evidence and interpretation -->
  <g transform="translate(55,274)">
    <text class="section ink" x="0" y="0">What the current evidence says</text>

    <rect class="support" x="0" y="22" width="348" height="114" rx="12"/>
    <text class="small ink" x="17" y="45">✓ BOUNDED INTERNAL SUPPORT  [M03]</text>
    <text class="head ink" x="17" y="70">Pooled evidence set: n=19</text>
    <text class="body ink" x="17" y="93">AUC 0.811; permutation p=0.008.</text>
    <text class="body ink" x="17" y="115">Tool checks held; flexible models were fragile.</text>

    <rect class="bound" x="0" y="150" width="348" height="114" rx="12"/>
    <text class="small ink" x="17" y="173">▧ IMPORTANT BOUNDS  [M02, M04]</text>
    <text class="body ink" x="17" y="198">Results were mixed across therapies and cohorts.</text>
    <text class="body ink" x="17" y="220">Broad immune-tone adjustment attenuated the</text>
    <text class="body ink" x="17" y="241">score; direct steroid metadata were unavailable.</text>
  </g>

  <g transform="translate(433,274)">
    <text class="section ink" x="0" y="0">What it may mean</text>

    <rect class="score" x="0" y="22" width="304" height="114" rx="12"/>
    <text class="small ink" x="17" y="45">● MONITORING HYPOTHESIS  [M01]</text>
    <text class="head ink" x="17" y="70">An early immune-state indicator</text>
    <text class="body ink" x="17" y="93">The score may report treatment-associated</text>
    <text class="body ink" x="17" y="115">remodeling before a later outcome is known.</text>

    <text class="tiny muted" x="17" y="163">Observation does not establish intervention.</text>
    <path class="blocked" d="M151 174 L151 212"/>
    <line x1="134" y1="185" x2="168" y2="199" stroke="#8b2e2e" stroke-width="4"/>

    <rect class="stop" x="0" y="220" width="304" height="80" rx="12"/>
    <text class="small ink" x="17" y="243">× NOT A CONTROL KNOB  [M05]</text>
    <text class="body ink" x="17" y="266">The association does not identify what</text>
    <text class="body ink" x="17" y="286">molecule or pathway should be changed.</text>
  </g>

  <g transform="translate(767,274)">
    <text class="section ink" x="0" y="0">What it does not establish</text>
    <rect class="stop" x="0" y="22" width="378" height="278" rx="12"/>
    <text class="small ink" x="18" y="48">BOUNDARY: DO NOT OVERREAD  [M01, M05]</text>

    <circle cx="30" cy="82" r="10" fill="#8b2e2e"/>
    <text class="small" x="26" y="86" fill="#ffffff">×</text>
    <text class="head ink" x="50" y="87">Not a drug target</text>
    <text class="body muted" x="50" y="106">Measurement is not causal direction.</text>

    <circle cx="30" cy="133" r="10" fill="#8b2e2e"/>
    <text class="small" x="26" y="137" fill="#ffffff">×</text>
    <text class="head ink" x="50" y="138">Not a treatment selector</text>
    <text class="body muted" x="50" y="157">No evidence it chooses the best therapy.</text>

    <circle cx="30" cy="184" r="10" fill="#8b2e2e"/>
    <text class="small" x="26" y="188" fill="#ffffff">×</text>
    <text class="head ink" x="50" y="189">Not proof of clinical benefit</text>
    <text class="body muted" x="50" y="208">Immune change is not patient benefit.</text>

    <circle cx="30" cy="235" r="10" fill="#8b2e2e"/>
    <text class="small" x="26" y="239" fill="#ffffff">×</text>
    <text class="head ink" x="50" y="240">Not evidence about progression</text>
    <text class="body muted" x="50" y="259">No disability-accumulation outcome was tested.</text>

    <text class="tiny muted" x="18" y="286">Independent validation would not erase these boundaries.</text>
  </g>

  <!-- Precommitted validation outcomes -->
  <line class="divider" x1="55" y1="598" x2="1145" y2="598"/>
  <text class="section ink" x="55" y="629">The next test has three honest outcomes  [A01]</text>
  <text class="body muted" x="465" y="629">The locked rule and interpretation are fixed before outcomes are visible.</text>

  <g transform="translate(55,650)">
    <rect class="outcome" x="0" y="0" width="342" height="84" rx="12"/>
    <text class="small ink" x="16" y="23">PASS</text>
    <text class="head ink" x="16" y="46">External monitoring evidence strengthens</text>
    <text class="body muted" x="16" y="67">Clinical utility and target status remain unproven.</text>

    <rect class="outcome" x="374" y="0" width="342" height="84" rx="12"/>
    <text class="small ink" x="390" y="23">FAIL</text>
    <text class="head ink" x="390" y="46">The lead is killed or bounded as preregistered</text>
    <text class="body muted" x="390" y="67">No post-hoc threshold, feature, or subgroup rescue.</text>

    <rect class="outcome" x="748" y="0" width="342" height="84" rx="12"/>
    <text class="small ink" x="764" y="23">INCONCLUSIVE</text>
    <text class="head ink" x="764" y="46">Effect size and uncertainty inform the next study</text>
    <text class="body muted" x="764" y="67">Underpowered evidence is not relabeled as success.</text>
  </g>

  <text class="tiny muted" x="55" y="763">Accessible source: docs/onboarding/MS_RESEARCH_EXPLAINED.md · Full evidence: FINDING_V22, ROBUSTNESS_MAP_V28, CONFOUNDER_AUDIT_V32, PREREGISTRATION_V42.</text>
</svg>
