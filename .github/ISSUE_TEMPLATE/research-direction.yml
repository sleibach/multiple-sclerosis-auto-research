name: Research direction
description: Propose a falsifiable method, dataset, analytical reframe, or research direction.
title: "[Direction] "
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. They become project directions only when they can be grounded.

        Start with `docs/onboarding/OPEN_PROBLEMS_FOR_COLLABORATORS.md` and keep monitoring, mechanism, target, clinical benefit, and progression as separate claims. Do not include patient-specific medical advice or private data.

  - type: dropdown
    id: problem
    attributes:
      label: Open problem
      description: Choose the nearest problem. Explain a genuinely new problem under "Proposal" if none fits.
      options:
        - "1 - Small cohort, honest validation"
        - "2 - Break single-cohort dependence"
        - "3 - Build longitudinal progression evidence"
        - "4 - Restore function in the required direction"
        - "5 - Identify real control points in a coupled system"
        - "6 - Detect confounding before interpretation"
        - "7 - Test genuinely new information prospectively"
        - "8 - Use a monitoring result safely"
        - "None - a distinct bounded problem"
    validations:
      required: true

  - type: textarea
    id: boundary
    attributes:
      label: Current boundary
      description: Name the claim IDs or project artifacts this direction builds on, and the exact limitation it addresses.
      placeholder: "Claim IDs: M04, C02. Boundary: ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal and assumptions
      description: Describe the method, mechanism, dataset, or reframe. Explain why it is not a known closed path and list assumptions.
    validations:
      required: true

  - type: textarea
    id: prediction
    attributes:
      label: Falsifiable prediction
      description: State the observable result, a competing explanation's different prediction, and the result that would make us drop the idea.
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Data and access
      description: Name required fields, unit of analysis, verified location or holder, access status, and use/privacy constraints.
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Test design
      description: Define the estimand, null or negative control, holdout, multiple-testing budget, small-sample method, and source/batch/confounder checks.
    validations:
      required: true

  - type: textarea
    id: consequence
    attributes:
      label: Decision consequence
      description: What changes if supported, not supported, or inconclusive? Keep each consequence bounded.
    validations:
      required: true

  - type: textarea
    id: provenance
    attributes:
      label: Sources and reproducibility
      description: List context sources with URLs/citations and dates accessed. Link code or describe where a runnable test would live.
    validations:
      required: true

  - type: checkboxes
    id: safeguards
    attributes:
      label: Safeguards
      options:
        - label: I read the nearest closed or negative route and explained how this differs.
          required: true
        - label: I separated outside-source context from project evidence.
          required: true
        - label: I included a failure condition rather than making every outcome supportive.
          required: true
        - label: This issue contains no patient-specific medical advice or private data.
          required: true
